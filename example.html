<section class="cases-section">
    <div class="cases-header">
        <h2>精選客戶案例</h2>
        <p>看看我們的家配師如何為客戶打造夢想空間</p>
    </div>

    <div class="stylist-group">
        <div class="stylist-info">
            <h3 class="stylist-name">家配師｜Emily</h3>
            <span class="stylist-style">北歐簡約、日式侘寂</span>
        </div>
        <div class="photo-slider">
            <img src="images/Emily/1.jpg" alt="案例照片" class="case-photo">
            <img src="images/Emily/2.jpg" alt="案例照片" class="case-photo">
            <img src="images/Emily/3.jpg" alt="案例照片" class="case-photo">
            <img src="images/Emily/4.jpg" alt="案例照片" class="case-photo">
            <img src="images/Emily/5.jpg" alt="案例照片" class="case-photo">
        </div>
    </div>

    <div class="stylist-group">
        <div class="stylist-info">
            <h3 class="stylist-name">家配師｜David</h3>
            <span class="stylist-style">現代低奢、工業風</span>
        </div>
        <div class="photo-slider">
            <img src="images/david/1.jpg" alt="案例照片" class="case-photo">
            <img src="images/david/2.jpg" alt="案例照片" class="case-photo">
            <img src="images/david/3.jpg" alt="案例照片" class="case-photo">
            <img src="images/david/4.jpg" alt="案例照片" class="case-photo">
        </div>
    </div>
</section>
<script>
    // 抓出畫面上所有的照片牆區塊
    const sliders = document.querySelectorAll('.photo-slider');

    sliders.forEach(slider => {
        // 🌟 無縫接軌的魔法：把裡面的照片複製一份貼在後面
        // 讓原本的照片陣列變成兩倍長
        slider.innerHTML += slider.innerHTML;

        let isPaused = false;
        let scrollSpeed = 1;  // 每次移動的距離 (數字越大滑越快)

        // 設定一個計時器，每 20 毫秒執行一次滑動
        setInterval(() => {
            if (!isPaused) {
                slider.scrollLeft += scrollSpeed;

                // 🌟 關鍵邏輯：
                // 當滑動的距離超過「總捲軸長度的一半」時，瞬間偷偷把位置減去一半。
                // 因為此時畫面剛好對齊複製出來的照片，瞬間切換回去完全看不出破綻！
                if (slider.scrollLeft >= slider.scrollWidth / 2) {
                    slider.scrollLeft -= slider.scrollWidth / 2;
                }
            }
        }, 40);

        // 當客人的滑鼠移到照片上時，暫停滑動
        slider.addEventListener('mouseenter', () => isPaused = true);

        // 當滑鼠移開時，繼續滑動
        slider.addEventListener('mouseleave', () => isPaused = false);

        // 照顧手機版客人：手指碰到時暫停，手指離開時繼續
        slider.addEventListener('touchstart', () => isPaused = true);
        slider.addEventListener('touchend', () => isPaused = false);
    });
</script>
